<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Web Tracker Suite</title>
  <meta name="description" content="Create your Web Tracker account." />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
  <div class="auth-bg">
    <div class="auth-glow"></div>

    <div class="auth-card">
      <!-- Logo Section -->
      <div class="auth-logo">
        <span class="auth-logo-icon">🐥</span>
        <div>
          <h1>Chick Chick</h1>
          <p>Create Account</p>
        </div>
      </div>

      <h2 class="auth-title">สมัครสมาชิกใหม่</h2>

      <!-- Alerts -->
      <div id="authError" class="auth-alert auth-alert-error" hidden></div>
      <div id="authSuccess" class="auth-alert auth-alert-success" hidden></div>

      <form id="registerForm" autocomplete="on" novalidate>
        <!-- Username Field -->
        <div class="field">
          <label for="regUsername">ชื่อผู้ใช้ (Username)</label>
          <div class="input-wrap">
            <input id="regUsername" type="text" name="username" placeholder="ตั้งชื่อผู้ใช้ของคุณ" autocomplete="username" required />
          </div>
        </div>

        <!-- Password Field -->
        <div class="field">
          <label for="regPassword">
            รหัสผ่าน (Password)
            <span class="field-hint">(อย่างน้อย 6 ตัวอักษร)</span>
          </label>
          <div class="input-wrap">
            <input id="regPassword" type="password" name="password" placeholder="ตั้งรหัสผ่านของคุณ" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" id="togglePwReg" aria-label="Toggle password visibility">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="field">
          <label for="regConfirm">ยืนยันรหัสผ่าน (Confirm Password)</label>
          <div class="input-wrap">
            <input id="regConfirm" type="password" name="confirm" placeholder="ป้อนรหัสผ่านอีกครั้ง" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" id="togglePwCfm" aria-label="Toggle password visibility">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn-primary" id="registerBtn">
          <span class="btn-text">สร้างบัญชีผู้ใช้</span>
          <span class="btn-spinner" style="display: none;"></span>
        </button>
      </form>

      <!-- Footer redirection links -->
      <p class="auth-footer">
        มีบัญชีใช้งานอยู่แล้ว?
        <a href="/login.html">เข้าสู่ระบบ</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/ui.js"></script>
</body>

</html>
