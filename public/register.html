<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สมัครสมาชิก — By.Chick Chick Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/auth.css" />
</head>

<body>
  <div class="auth-bg">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-logo-icon">🐥</span>
        <div>
          <h1>By.Chick Chick</h1>
          <p>Dashboard</p>
        </div>
      </div>

      <h2 class="auth-title">สมัครสมาชิก</h2>

      <div id="authError" class="auth-alert auth-alert-error" hidden></div>
      <div id="authSuccess" class="auth-alert auth-alert-success" hidden></div>

      <form id="registerForm" autocomplete="on" novalidate>
        <div class="field">
          <label for="regEmail">อีเมล</label>
          <input id="regEmail" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="regPassword">รหัสผ่าน <span class="field-hint">(อย่างน้อย 6 ตัวอักษร)</span></label>
          <div class="input-wrap">
            <input id="regPassword" type="password" name="password" placeholder="••••••••" autocomplete="new-password" required minlength="6" />
            <button type="button" class="toggle-pw" id="togglePwReg" aria-label="แสดง/ซ่อนรหัสผ่าน">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="regConfirm">ยืนยันรหัสผ่าน</label>
          <div class="input-wrap">
            <input id="regConfirm" type="password" name="confirm" placeholder="••••••••" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" id="togglePwCfm" aria-label="แสดง/ซ่อนรหัสผ่าน">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="registerBtn">
          <span class="btn-text">สมัครสมาชิก</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </form>

      <p class="auth-footer">
        มีบัญชีอยู่แล้ว?
        <a href="/login.html">เข้าสู่ระบบ</a>
      </p>
    </div>
  </div>

  <script type="module" src="/auth.js"></script>
</body>

</html>
