<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Chick Chick tracker</title>
  <meta name="description" content="Sign in to your Web Tracker dashboard." />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
  <div class="auth-bg">
    <div class="auth-glow"></div>

    <div class="auth-card">
      <!-- Logo Section -->
      <div class="auth-logo">
        <span class="auth-logo-icon">🐥</span>
        <div>
          <h1>Chick Chick</h1>
          <p>Web Tracker</p>
        </div>
      </div>

      <h2 class="auth-title">เข้าสู่ระบบบัญชีของคุณ</h2>

      <!-- Alerts -->
      <div id="authError" class="auth-alert auth-alert-error" hidden></div>
      <div id="authSuccess" class="auth-alert auth-alert-success" hidden></div>

      <form id="loginForm" autocomplete="on" novalidate>
        <!-- Username Input -->
        <div class="field">
          <label for="loginUsername">ชื่อผู้ใช้ (Username)</label>
          <div class="input-wrap">
            <input id="loginUsername" type="text" name="username"  placeholder="กรอกชื่อผู้ใช้ของคุณ" autocomplete="username" required />
          </div>
        </div>

        <!-- Password Input -->
        <div class="field">
          <label for="loginPassword">
            รหัสผ่าน (Password)
          </label>
          <div class="input-wrap">
            <input id="loginPassword" type="password" name="password" placeholder="กรอกรหัสผ่านของคุณ" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
          
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text">เข้าสู่ระบบ</span>
          <span class="btn-spinner" style="display: none;"></span>
        </button>
      </form>

      <!-- Footer navigation links -->
      <p class="auth-footer">
        ยังไม่มีบัญชีใช้งาน?
        <a href="/register.html">สมัครสมาชิกที่นี่</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/ui.js"></script>
</body>

</html>
