<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - By.Chick Chick</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>

<body class="auth-page auth-page--login">
  <div class="auth-bg-mesh" aria-hidden="true"></div>

  <main class="auth-wrap auth-wrap--login">
    <h1 class="login-wordmark">Chick Chick</h1>

    <section class="auth-card auth-card--login" aria-label="Login">
      <h2 class="auth-title">Login</h2>
      <p class="auth-subtitle">Welcome back, Commander.</p>

      <div id="authError" class="auth-alert auth-alert-error" hidden></div>
      <div id="authSuccess" class="auth-alert auth-alert-success" hidden></div>

      <form id="loginForm" class="auth-form" autocomplete="on" novalidate>
        <div class="field">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">mail</span>
            <input id="loginEmail" type="email" name="email" placeholder="name@nexus.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input id="loginPassword" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text">Login</span>
          <span class="material-symbols-outlined">bolt</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </form>

      <p class="auth-footer">
        New to the suite?
        <a href="/register.html">Create an account</a>
      </p>
    </section>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/ui.js"></script>
</body>

</html>
