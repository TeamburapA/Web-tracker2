<!doctype html>
<html lang="th" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — By.Chick Chick</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>

<body class="auth-page auth-page--login">
  <div class="auth-bg-mesh" aria-hidden="true"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo-row">
        <div class="chick-icon chick-icon--sm">🐥</div>
        <div class="auth-brand">
          <h1>Chick Chick</h1>
          <p>Dashboard</p>
        </div>
      </div>

      <h2 class="auth-title">เข้าสู่ระบบ</h2>
      <p class="auth-subtitle">Welcome back, Commander.</p>

      <div id="authError" class="auth-alert auth-alert-error" hidden></div>
      <div id="authSuccess" class="auth-alert auth-alert-success" hidden></div>

      <form id="loginForm" class="auth-form" autocomplete="on" novalidate>
        <div class="field">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">mail</span>
            <input id="loginEmail" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input id="loginPassword" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="แสดง/ซ่อนรหัสผ่าน">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text">เข้าสู่ระบบ</span>
          <span class="material-symbols-outlined">bolt</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </form>

      <p class="auth-footer">
        ยังไม่มีบัญชี?
        <a href="/register.html">สมัครสมาชิก</a>
      </p>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/ui.js"></script>
</body>

</html>
