<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — By.Chick Chick</title>
  <meta name="description" content="By.Chick Chick real-time Roblox dashboard with player stats, coins, and analytics." />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>

<body class="dash-body">
  <div class="dash-backdrop" aria-hidden="true"></div>
  <div class="dash-noise" aria-hidden="true"></div>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header class="dash-header">
    <div class="dash-header-left">
      <span class="dash-brand">
        <span class="dash-brand-icon"><span>CC</span></span>
        <span class="dash-brand-text">By.Chick Chick</span>
      </span>

      <div class="dash-header-stats">
        <div class="dash-stat">
          <label>Online</label>
          <span id="onlineCount">0</span>
        </div>
        <div class="dash-stat-divider"></div>
        <div class="dash-stat">
          <label>Total Coins</label>
          <span id="totalCoins">0</span>
        </div>
        <div class="dash-stat-divider"></div>
        <div class="dash-stat">
          <label>Total Units</label>
          <span id="totalUnits">0</span>
        </div>
      </div>
    </div>

    <nav class="dash-tabs" aria-label="Dashboard sections">
      <a class="dash-tab active" href="/">
        <span class="material-symbols-outlined">monitoring</span>
        Stats
      </a>
    </nav>

    <div class="dash-header-right user-info">
      <button type="button" id="copyAllBtn" class="btn-copy btn-copy--top">
        <span class="material-symbols-outlined">content_copy</span>
        Copy Key
      </button>
      <button class="icon-btn" type="button" aria-label="Notifications">
        <span class="material-symbols-outlined">notifications</span>
      </button>
      <span class="user-avatar" aria-hidden="true">🐥</span>
      <span id="userEmail" class="user-email"></span>
      <button type="button" id="logoutBtn" class="btn-logout" title="Logout">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </div>
  </header>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="app">

    <!-- Hero -->
    <section class="hero-panel" id="script-key">
      <div class="hero-copy">
        <div class="hero-kicker">
          <span class="hero-kicker-line"></span>
          Script Key
        </div>
        <h1>Active Script Key</h1>
      </div>
      <span class="hero-key-mark material-symbols-outlined" aria-hidden="true">vpn_key</span>
    </section>

    <!-- Key display -->
    <section class="key-panel">
      <div class="key-display">
        <div class="key-display-glow" aria-hidden="true"></div>
        <code id="scriptKeyValue">Loading...</code>
        <button type="button" id="scriptKeyCopyBtn" class="btn-key-copy">
          <span class="material-symbols-outlined">content_copy</span>
          Copy
        </button>
      </div>
    </section>

    <!-- Linked accounts -->
    <section class="accounts-panel">
      <div class="accounts-header">
        <span class="material-symbols-outlined">group</span>
        Linked Roblox Accounts
      </div>
      <div class="accounts-row">
        <div id="accountsList" class="accounts-list">
          <span class="account-empty">No linked Roblox accounts yet</span>
        </div>
      </div>
      <span id="accountsCount" class="accounts-count-sr">0</span>
    </section>

    <!-- Data table -->
    <section class="table-section glass-card">
      <div class="filters">
        <label class="search-box" for="searchInput">
          <span class="material-symbols-outlined">search</span>
          <input id="searchInput" type="search" placeholder="Search accounts or IDs…" />
        </label>

        <div class="filters-right">
          <label class="sort-label" for="sortSelect">Sort:</label>
          <select id="sortSelect">
            <option value="coins">Coins (High)</option>
            <option value="updated">Last Update</option>
            <option value="utc">UTC (High)</option>
            <option value="uts">UTS (High)</option>
            <option value="cinema">Cinema (High)</option>
          </select>
          <button type="button" id="copyScriptBtnMirror" class="btn-copy btn-copy--table">
            <span class="material-symbols-outlined">terminal</span>
            Copy Script
          </button>
          <button type="button" id="refreshBtn" class="btn-refresh" title="Refresh data">
            <span class="refresh-icon material-symbols-outlined">refresh</span>
            Refresh
          </button>
        </div>
      </div>

      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Account</th>
              <th>Coins</th>
              <th>UTC</th>
              <th>UTS</th>
              <th>Cinema</th>
              <th>Status</th>
              <th>Last Update</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="playerRows">
            <tr>
              <td colspan="8" class="empty">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <footer class="table-footer">
        <span id="tableCountLabel">Live roster standby</span>
        <div class="pager" aria-hidden="true">
          <button>Previous</button>
          <button class="active">1</button>
          <button>2</button>
          <button>3</button>
          <button>Next</button>
        </div>
      </footer>
    </section>
  </main>

  <div id="copyToast" class="copy-toast" hidden>Copied</div>

  <script>
    document.getElementById("copyScriptBtnMirror")?.addEventListener("click", () => {
      document.getElementById("copyAllBtn")?.click();
    });
  </script>
  <script type="module" src="/js/app.js"></script>
</body>

</html>
